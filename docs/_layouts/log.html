---
layout: default
---
<article class="post">
  <a href="{{ '/posts/' | relative_url }}" class="back-link"><span class="arrow" aria-hidden="true">&larr;</span> all posts</a>
  <header class="post-header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{% include date.html date=page.date %}</time>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
