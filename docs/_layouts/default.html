<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" id="color-scheme" content="light">
  <meta name="theme-color" id="theme-color" content="#faf9f5">
  <script>
    (function () {
      var theme = "light";
      try {
        var stored = localStorage.getItem("theme");
        if (stored === "dark" || stored === "light") theme = stored;
      } catch (e) {}
      if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
      document.getElementById("color-scheme").setAttribute("content", theme);
      document.getElementById("theme-color").setAttribute("content", theme === "light" ? "#faf9f5" : "#0b0c0e");
    })();
  </script>
  {% if page.url == "/" %}
  <title>{{ site.data.profile.name }} | {{ site.data.profile.role }}</title>
  {% else %}
  <title>{{ page.title }} | {{ site.data.profile.name }}</title>
  {% endif %}
  <meta name="description" content="{{ site.data.profile.role }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    <div class="wrap">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
  <script>
    (function () {
      var button = document.querySelector(".theme-toggle");
      if (!button) return;

      function sync(theme) {
        var light = theme === "light";
        if (light) document.documentElement.setAttribute("data-theme", "light");
        else document.documentElement.removeAttribute("data-theme");
        var scheme = document.getElementById("color-scheme");
        var color = document.getElementById("theme-color");
        if (scheme) scheme.setAttribute("content", theme);
        if (color) color.setAttribute("content", light ? "#faf9f5" : "#0b0c0e");
        button.setAttribute("aria-pressed", light ? "true" : "false");
        button.setAttribute("aria-label", light ? "Switch to dark mode" : "Switch to light mode");
      }

      sync(document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark");
      button.addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
        try { localStorage.setItem("theme", next); } catch (e) {}
        sync(next);
      });
    })();
  </script>
</body>
</html>
