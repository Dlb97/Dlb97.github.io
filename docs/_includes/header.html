<header class="site-header">
  <div class="wrap">
    <a href="{{ '/' | relative_url }}" class="brand"><span class="sigil" aria-hidden="true">$</span>{{ site.data.profile.brand }}</a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>home</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url contains "/projects" %} aria-current="page"{% endif %}>projects</a>
      <a href="{{ '/posts/' | relative_url }}"{% if page.url contains "/posts" %} aria-current="page"{% endif %}>posts</a>
      <button type="button" class="theme-toggle" aria-pressed="true" aria-label="Switch to dark mode">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/>
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.8 5.8l1.5 1.5M16.7 16.7l1.5 1.5M18.2 5.8l-1.5 1.5M7.3 16.7l-1.5 1.5"/>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M15.2 3.1a7.4 7.4 0 1 0 5.7 12.2A5.8 5.8 0 0 1 15.2 3.1z"/>
        </svg>
        <span class="theme-toggle-thumb" aria-hidden="true"></span>
      </button>
    </nav>
  </div>
</header>
